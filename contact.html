  <header>
    <h1>Contact Me</h1>
  </header>

  <main>
    <section class="contact-section">
      <h2>Get in Touch</h2>
      <p>
        Have questions, want to collaborate, or just want to say hello? Fill out the form below, and I'll get back to you as soon as possible.
      </p>
      <form id="contactForm" name="contactForm" novalidate>
        <div class="form-group">
          <label for="name">Name:</label>
          <input type="text" name="name" id="name" placeholder="Your full name" required>
        </div>

        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" name="email" id="email" placeholder="Your email address" required>
        </div>

        <div class="form-group">
          <label for="age">Age:</label>
          <input type="number" name="age" id="age" placeholder="Your age" min="18" max="100" required>
        </div>

        <div class="form-group">
          <label for="theme">Select Theme:</label>
          <select name="theme" id="theme">
            <option value="default">Default</option>
            <option value="dark">Dark</option>
            <option value="light">Light</option>
          </select>
        </div>

        <div class="form-group">
          <label for="skills">Select Skills (Array Manipulation):</label><br>
          <label for="skill1">
            JavaScript<input type="checkbox" id="skill1" name="skills" value="JavaScript">
          </label>
          <label for="skill2">
            HTML<input type="checkbox" id="skill2" name="skills" value="HTML">
          </label>
          <label for="skill3">
            CSS<input type="checkbox" id="skill3" name="skills" value="CSS">
          </label>
        </div>

        <!-- Display Selected Skills -->
        <div id="selectedSkills" class="selected-skills"></div>

        <div class="form-group">
          <label for="message">Message:</label>
          <textarea name="message" id="message" rows="4" placeholder="Your message" required></textarea>
        </div>

        <div class="form-group">
          <label for="upload">Upload a text file:</label>
          <input type="file" name="upload" id="fileInput" accept=".txt">
        </div>

        <div class="form-group">
          <input type="submit" value="Submit">
        </div>
      </form>

      <!-- Output area for validation messages -->
      <div id="form-messages"></div>
      <div id="output"></div>
    </section>
  </main>
